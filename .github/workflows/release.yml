name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/validate.yml
  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Check tag, all version declarations, and required release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python scripts/package.py dist "$RELEASE_TAG"
          python -c 'import os,pathlib; tag=os.environ["RELEASE_TAG"]; assert pathlib.Path("releases",tag.removeprefix("v")+".md").is_file(), "Missing release notes"'
      - name: Publish the compiled HACS asset and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then release_flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" "${release_flags[@]}" dist/emad_dashboard.zip dist/emad_dashboard-*.zip dist/SHA256SUMS dist/release-manifest.json --verify-tag --title "Emad Dashboard $RELEASE_TAG" --notes-file "releases/${RELEASE_TAG#v}.md"

  verify-published:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - run: python scripts/fetch-hacs.py "$RUNNER_TEMP/hacs-runtime"
      - name: Install and update using the actual public release asset
        env:
          PYTHONPATH: ${{ runner.temp }}/hacs-runtime
          PYTHONDONTWRITEBYTECODE: '1'
          EMAD_LIVE_HACS_RELEASE: '1'
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m pytest -c pytest.ini hacs_tests/test_live_release.py
